# PERI-METER Phase 1 Workflow Graph
workflow: perimeter-phase1
version: 1
repo: Redser06/peri-meter-craft
base: main
base_sha: e98530a7fca251060890458559b68ac59a8a548f
branch: conor/perimeter-rework-phase1
gate_runner: tools/eval_runner.py
registry: [gates/perimeter-phase1.registry.json]
budget: { llm_usd_month_cap: 5.00, ci_provider: fake, on_cap_unknown: fail_closed }

nodes:
  - id: lessons_read
    gate: [lessons_read_ok]
  - id: preflight
    deps: [lessons_read]
    gate: [preflight_schema_valid, preflight_no_p1_findings, preflight_no_open_approvals]
  - id: human_approval
    deps: [preflight]
    gate: [perimeter_approval_recorded]
  - id: cursor_handoff
    deps: [human_approval]
    gate: [handoff_branch_exists]
  - id: readme_rebrand_spec
    deps: [cursor_handoff]
    gate: [perimeter_neutral_brand_clean, perimeter_readme_rich_contract]
  - id: state_contract_delta
    deps: [readme_rebrand_spec]
    gate: [perimeter_state_delta_valid, perimeter_pydantic_schema_sync]
  - id: stitch_journey_spec
    deps: [state_contract_delta]
    gate: [perimeter_stitch_token_valid, perimeter_journey_matrix_verified]
  - id: eval_curriculum_spec
    deps: [stitch_journey_spec]
    gate: [perimeter_curriculum_dag_acyclic, perimeter_eval_suite_deterministic]
  - id: roi_telemetry_spec
    deps: [eval_curriculum_spec]
    gate: [perimeter_roi_monotonic_increasing, perimeter_ledger_cap_enforced]
  - id: ci
    deps: [roi_telemetry_spec]
    gate: [perimeter_protected_files, ci_all_required_checks_pass]
  - id: proofs
    deps: [ci]
    gate: [proofs_every_ac_has_location]
  - id: ready_for_review
    deps: [proofs]
